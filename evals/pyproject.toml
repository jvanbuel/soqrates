[project]
name = "soqrates-evals"
version = "0.1.0"
description = "Evals for Soqrates (ADR-0001 D13). They call real models and are never run by cargo test."
requires-python = ">=3.11"
dependencies = [
    "inspect-ai>=0.3.100",
    "mcp>=1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["soqrates_evals"]
