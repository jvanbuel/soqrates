# A PostgreSQL for the SQL store's integration tests (ADR-0005 D6).
#
#   docker compose up -d --wait
#   SOQRATES_TEST_POSTGRES_URL=postgres://soqrates:soqrates@localhost:5432/soqrates_test \
#     cargo test -p soqrates-store --features postgres
#   docker compose down
#
# The tests empty the database, so point them only at this one.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: soqrates
      POSTGRES_PASSWORD: soqrates
      POSTGRES_DB: soqrates_test
    ports:
      - "5432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soqrates -d soqrates_test"]
      interval: 1s
      timeout: 3s
      retries: 30
