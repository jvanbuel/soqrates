[package]
name = "soqrates-cli"
description = "The `soqrates` binary: git/jj hooks, CI check and MCP server (ADR-0001 D1)."
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "soqrates"
path = "src/main.rs"

[dependencies]
soqrates-core.workspace = true
soqrates-store = { workspace = true, features = ["sqlite", "postgres"] }
soqrates-examiner.workspace = true
soqrates-scm-github.workspace = true
soqrates-mcp.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
clap = { version = "4.6", features = ["derive", "env"] }
dirs = "7"
getrandom = "0.4"
toml = "1"
