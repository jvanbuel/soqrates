name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  check:
    name: fmt, clippy, tests (incl. architecture + ADR traceability + acceptance ratchet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # rustup on the runner picks up rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Architecture fitness + ADR traceability (ADR-0001 D2-D6, D10-D12, D15)
        run: cargo test -p soqrates-spec --test architecture -- --nocapture
      - name: Acceptance ratchet (non-@wip scenarios must pass, ADR-0001 D15)
        run: cargo test -p soqrates-spec --test acceptance
      - name: Unit tests
        run: cargo test --workspace --exclude soqrates-spec

  postgres:
    name: SQL store against PostgreSQL (ADR-0005 D6)
    runs-on: ubuntu-latest
    # The same database as compose.yaml, which runs these tests locally.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: soqrates
          POSTGRES_PASSWORD: soqrates
          POSTGRES_DB: soqrates_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U soqrates -d soqrates_test"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
    env:
      SOQRATES_TEST_POSTGRES_URL: postgres://soqrates:soqrates@localhost:5432/soqrates_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
      # Without the URL these tests pass without doing anything, so check
      # that the PostgreSQL test really ran.
      - name: PostgreSQL conformance suite
        run: |
          set -o pipefail
          cargo test -p soqrates-store --features postgres -- --nocapture postgres 2>&1 | tee pg.log
          if grep -q "SOQRATES_TEST_POSTGRES_URL is not set" pg.log; then
            echo "::error::the PostgreSQL tests were skipped"; exit 1
          fi
          grep -q "postgres_conforms_and_claims_are_exclusive ... ok" pg.log

  backlog:
    name: acceptance backlog (all scenarios, incl. @wip; informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p soqrates-spec --test acceptance
        env:
          SOQRATES_SPEC_ALL: "1"
