# Dogfooding (ADR-0001 D14): Soqrates checks its own pull requests.
#
# - Runs on PR open/push, when someone comments `/soqrates ...` on a PR,
#   and when a Soqrates question comment is edited (ticking a checkbox edits
#   the comment, ADR-0004 D3). Edits made with the workflow's own token
#   don't trigger workflows, so posting results doesn't loop.
# - Advisory mode: a failed session reports a success status with an
#   "Advisory:" note, so it never blocks a merge.
# - Runs the Soqrates action from this checkout (`uses: ./`, ADR-0006 D5),
#   with a binary built from this source instead of a released one, so every
#   pull request tests the action as users run it.
# - Learner state is kept on the `soqrates-state` branch (one JSON document
#   per profile/link/session, see soqrates-store's FileStore).
# - Needs the repository secret ANTHROPIC_API_KEY; without it the job skips.
# - Posts as soqrates[bot] when the Soqrates GitHub App is configured
#   (repository variable SOQRATES_APP_ID and secret SOQRATES_APP_PRIVATE_KEY,
#   see docs/github-app.md); otherwise as github-actions[bot].
#
# Note: GitHub runs `issue_comment` workflows from the default branch, so
# answering by comment works once this file is on the default branch.
name: soqrates

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created, edited]

permissions:
  contents: write       # push the soqrates-state branch
  pull-requests: write  # read the PR and its diff
  issues: write         # post the questions as a PR comment
  statuses: write       # set the `soqrates` commit status

jobs:
  check:
    # Comment edits count only on Soqrates' own question comment, and only
    # once "Grade my answers" is ticked, so ticking options starts no runs.
    # Pull requests by bots (release-plz, Dependabot) have nobody to ask.
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot') ||
      (github.event.issue.pull_request && (
        (github.event.action == 'created' && startsWith(github.event.comment.body, '/soqrates')) ||
        (github.event.action == 'edited' &&
          endsWith(github.event.comment.user.login, '[bot]') &&
          contains(github.event.comment.body, 'soqrates:session=') &&
          contains(github.event.comment.body, '- [x] **Grade my answers**'))
      ))
    # One run at a time, so state-branch updates never race. Job-level, so
    # skipped runs (other bots' comments) never queue here and displace a
    # pending real run.
    concurrency:
      group: soqrates-state
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Skip without an API key
        id: key
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::ANTHROPIC_API_KEY is not set; skipping the Soqrates check."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # For issue_comment events this checks out the default branch, so no
      # code from the PR runs with the secrets.
      - uses: actions/checkout@v4
        if: steps.key.outputs.skip != 'true'

      # The built binary is cached per source version, so most runs (every
      # answer on a PR) skip the multi-minute build.
      - name: Restore the soqrates binary
        id: bin
        if: steps.key.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: target/release/soqrates
          key: soqrates-bin-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'crates/**/Cargo.toml', 'crates/**/*.rs') }}

      - uses: Swatinem/rust-cache@v2
        if: steps.key.outputs.skip != 'true' && steps.bin.outputs.cache-hit != 'true'

      - name: Build soqrates
        if: steps.key.outputs.skip != 'true' && steps.bin.outputs.cache-hit != 'true'
        run: cargo build --release --locked -p soqrates-cli

      - name: Run Soqrates
        if: steps.key.outputs.skip != 'true'
        uses: ./
        with:
          mode: advisory
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          binary: target/release/soqrates
          # Post as soqrates[bot] when the Soqrates GitHub App is configured.
          app-id: ${{ vars.SOQRATES_APP_ID }}
          app-private-key: ${{ secrets.SOQRATES_APP_PRIVATE_KEY }}
