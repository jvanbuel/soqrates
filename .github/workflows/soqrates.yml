# Dogfooding (ADR-0001 D14): Soqrates checks its own pull requests.
#
# - Runs on PR open/push, when someone comments `/soqrates ...` (or
#   `/socrates ...`, or `@<app slug> answer`/`feedback`) on a PR, when the PR author
#   edits such a comment (ADR-0004 D8), and when a Soqrates question comment
#   is edited (ticking a checkbox or typing into an open question's answer
#   field edits the comment, ADR-0004 D3, D11). Edits made
#   with the workflow's own token don't trigger workflows, so posting results
#   doesn't loop.
# - On every push to main it builds and caches main's binary (job `warm`):
#   comment-triggered runs run on the default branch, so they find it cached
#   instead of building for minutes while the author waits (ADR-0006 D5).
# - Advisory mode: a failed session reports a success status with an
#   "Advisory:" note, so it never blocks a merge.
# - Runs the Soqrates action from this checkout (`uses: ./`, ADR-0006 D5),
#   with a binary built from this source instead of a released one, so every
#   pull request tests the action as users run it.
# - Learner state is kept on the `soqrates-state` branch (one JSON document
#   per profile/link/session, see soqrates-store's FileStore).
# - Needs the repository secret ANTHROPIC_API_KEY; without it the job skips.
# - Posts as soqrates[bot] when the Soqrates GitHub App is configured
#   (repository variable SOQRATES_APP_ID and secret SOQRATES_APP_PRIVATE_KEY,
#   see docs/github-app.md); otherwise as github-actions[bot].
#
# Note: GitHub runs `issue_comment` workflows from the default branch, so
# answering by comment works once this file is on the default branch.
name: soqrates

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created, edited]
  push:
    branches: [main]

permissions:
  contents: write       # push the soqrates-state branch
  pull-requests: write  # read the PR and its diff
  issues: write         # post the questions as a PR comment
  statuses: write       # set the `soqrates` commit status

jobs:
  check:
    # Commands may be spelt `/soqrates` or `/socrates` (startsWith ignores
    # case), or mention the app (`@<slug> answer` or `@<slug> feedback`; the
    # binary checks the slug), the prefixes of soqrates-core's
    # answer_command (ADR-0004 D8). `/soqrates feedback ...` comments on the
    # results (ADR-0011 D2) pass the same filter.
    # The PR author may fix a command by editing it. Other comment edits
    # count only on Soqrates' own question comment, and only once "Grade my
    # answers" is ticked, so ticking options and typing into answer fields
    # (ADR-0004 D11) start no runs. The binary reads the comment itself, so
    # text typed into a field that merely looks like a ticked box starts a
    # run that finds nothing submitted.
    # Pull requests by bots (Dependabot) and release PRs (release-plz, even
    # when opened with a personal token) have nobody to ask.
    if: >-
      (github.event_name == 'pull_request' &&
        github.event.pull_request.user.type != 'Bot' &&
        !startsWith(github.head_ref, 'release-plz-')) ||
      (github.event.issue.pull_request && (
        ((github.event.action == 'created' ||
            (github.event.action == 'edited' &&
              github.event.comment.user.id == github.event.issue.user.id)) &&
          (startsWith(github.event.comment.body, '/soqrates') ||
            startsWith(github.event.comment.body, '/socrates') ||
            (startsWith(github.event.comment.body, '@') &&
              (contains(github.event.comment.body, ' answer') ||
                contains(github.event.comment.body, ' feedback'))))) ||
        (github.event.action == 'edited' &&
          endsWith(github.event.comment.user.login, '[bot]') &&
          contains(github.event.comment.body, 'soqrates:session=') &&
          contains(github.event.comment.body, '- [x] **Grade my answers**'))
      ))
    # One run at a time, so state-branch updates never race. Job-level, so
    # skipped runs (other bots' comments) never queue here. `queue: max`
    # keeps every waiting run, in order: without it a group holds one
    # running and one pending run, and a newer run cancels the pending one,
    # so with several open PRs their checks were cancelled before running.
    concurrency:
      group: soqrates-state
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Skip without an API key
        id: key
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::ANTHROPIC_API_KEY is not set; skipping the Soqrates check."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # For issue_comment events this checks out the default branch, so no
      # code from the PR runs with the secrets.
      - uses: actions/checkout@v4
        if: steps.key.outputs.skip != 'true'

      # The built binary is cached per source version, so most runs (every
      # answer on a PR) skip the multi-minute build.
      - name: Restore the soqrates binary
        id: bin
        if: steps.key.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: target/release/soqrates
          key: soqrates-bin-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'crates/**/Cargo.toml', 'crates/**/*.rs') }}

      - uses: Swatinem/rust-cache@v2
        if: steps.key.outputs.skip != 'true' && steps.bin.outputs.cache-hit != 'true'

      - name: Build soqrates
        if: steps.key.outputs.skip != 'true' && steps.bin.outputs.cache-hit != 'true'
        run: cargo build --release --locked -p soqrates-cli

      - name: Run Soqrates
        if: steps.key.outputs.skip != 'true'
        uses: ./
        with:
          mode: advisory
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          binary: target/release/soqrates
          # Post as soqrates[bot] when the Soqrates GitHub App is configured.
          app-id: ${{ vars.SOQRATES_APP_ID }}
          app-private-key: ${{ secrets.SOQRATES_APP_PRIVATE_KEY }}

  # Comment-triggered runs check out the default branch, and a cache saved on
  # it is visible to every later run, so building main's binary here means
  # answers are graded without a build (ADR-0006 D5). The key must match the
  # one in `check`.
  warm:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Restore the soqrates binary
        id: bin
        uses: actions/cache@v4
        with:
          path: target/release/soqrates
          key: soqrates-bin-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'crates/**/Cargo.toml', 'crates/**/*.rs') }}

      - uses: Swatinem/rust-cache@v2
        if: steps.bin.outputs.cache-hit != 'true'

      - name: Build soqrates
        if: steps.bin.outputs.cache-hit != 'true'
        run: cargo build --release --locked -p soqrates-cli
