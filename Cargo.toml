[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jvanbuel/soqrates"
rust-version = "1.97.1"

[workspace.dependencies]
soqrates-core = { path = "crates/soqrates-core" }
soqrates-store = { path = "crates/soqrates-store" }
soqrates-examiner = { path = "crates/soqrates-examiner" }
soqrates-scm-github = { path = "crates/soqrates-scm-github" }
soqrates-mcp = { path = "crates/soqrates-mcp" }
chrono = { version = "0.4", features = ["serde"] }
rs-fsrs = { version = "1.2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["any", "runtime-tokio"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
